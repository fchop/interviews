<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type=text/javascript src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #D3D3D3; /* #075e54 */
            font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        .chat-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;             /* Full viewport height */
            width: 100%;
            padding: 10px 0;           /* 👈 Only top & bottom padding */
            box-sizing: border-box;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 100%;              /* Let it fill wrapper height */
            background-color: #ece5dd;
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .chat-header {
        background-color: #075e54;
        color: white;
        padding: 15px;
        font-size: 20px;
        font-weight: 500;
        border-top-left-radius: 20px;
        border-top-right-radius: 20px;
    }
    </style>

</head>

<style>
    body, div, textarea, button {
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
</style>
 
<body>
    <div class="chat-wrapper">
        <div class="chat-container">
            <div class="chat-header">Public Views on Social Assistance</div>
        
            <!-- Chat Area: The conversation history goes here. Contains questions and previously written responses. -->
            <div style="overflow-y: scroll; height: calc(100% - 200px); margin-bottom: 5px; border: 2px solid #ece5dd; border-radius: 5px; padding: 10px; display: flex; flex-direction: column; align-items: flex-end;" id="chatArea"></div>
        
            <!-- Text input field: Respondents write their responses in this container. It sits directly below the chat area. -->
            <div style="position: relative; margin-top: 5px;" class="input-container"><textarea style="width: 90%; resize: vertical; font-size: 18px; min-height: 150px; max-height: 150px; border: 4px solid #ece5dd; border-radius: 10px; padding: 10px; overflow: auto; margin-left: 10px;" placeholder="Type your message here..." maxlength="3000" id="inputBox"></textarea></div>
        
            <!-- Footer: Contains optional instructions to the respondent and the submit button. Placed below the text input field.  -->
            <div style="display: flex; justify-content: flex-end; padding-top: 10px;" class="submit-button-container">
                <!-- Optional instructions. Leave empty if not needed. -->
                <div style="flex-grow: 1; font-size: 18px; border: none; height: 30px; line-height: 1.2; padding-left: 10px; color: black; font-size: small;">Responses will not be shared</div>
                <!-- Record button: Respondents have to click this button to record a response. -->
                <button style="background-color: #D3D3D3; color: black; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 18px; transition: background-color 0.3s; margin-right: 15px; margin-bottom: 5px" id="recordButton">Record response</button>
                <!-- Submit button: Respondents have to click this button to submit a response. -->
                <button style="background-color: #25d366; color: black; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 18px; transition: background-color 0.3s; margin-bottom: 5px; margin-right: 15px" id="submitButton">Submit response</button>
            </div>
        </div>
    </div>
</body>


<script>

var chatArea = document.getElementById("chatArea");
var submitButton = document.getElementById("submitButton");
var userInput = document.getElementById("inputBox")


////////////////////////////////
//// START AUDIO INPUT CODE ////
////////////////////////////////    

let mediaRecorder;
let audioChunks = []; 
let stream;
var recordButton = document.getElementById("recordButton"); // The record button

recordButton.addEventListener("click", async () => {
    if (recordButton.textContent === "Record response") {
        // Start recording
        try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = []; // Reset the audio chunks
            recordButton.textContent = "Stop recording";
            submitButton.disabled = true;
            mediaRecorder.start();
            mediaRecorder.ondataavailable = (event) => {
                audioChunks.push(event.data);
            };
        } catch (err) {
            alert("Error accessing microphone: " + err.message);
            submitButton.disabled = false;
        }
    } else if (recordButton.textContent === "Stop recording") {
        // Stop recording
        recordButton.textContent = "Transcribing audio...";
        recordButton.disabled = true;
        mediaRecorder.stop();
        mediaRecorder.onstop = async () => {
            // Create audio blob in base64 format
            const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
            const reader = new FileReader();
            reader.onloadend = async () => {
                const audioBase64 = reader.result.split(",")[1]; // Remove the "data:..." prefix
                // Send audio to the transcribe API endpoint
                try {
                    jQuery.ajax({
                        url: "{{ url_for('transcribe') }}",
                        type: "POST",
                        timeout: 60000,
                        data: JSON.stringify({
                            audio: audioBase64
                        }),
                        contentType: "application/json",
                        dataType: "json",
                        success: function (data) {
                            const transcript = data.transcription || "Transcription failed. Please try again.";
                            userInput.value = transcript;
                            recordButton.textContent = "Record response";
                            submitButton.disabled = false;
                        },
                        error: function (jqXHR, textStatus, errorThrown) {
                            console.error("Error:", errorThrown);
                            alert("Something went wrong with the transcription. Please try again.");
                            recordButton.textContent = "Record response";
                            submitButton.disabled = false;
                        }
                    });
                } catch (error) {
                    console.error("Communication Error:", error);
                    alert("Error communicating with the API: " + error.message);
                    recordButton.textContent = "Record response";
                } finally {
                    // Clean up
                    audioChunks = [];
                    recordButton.disabled = false;
                    submitButton.disabled = false;
                }
            };

            reader.readAsDataURL(audioBlob); // Trigger the Base64 encoding
            stream.getTracks().forEach(track => track.stop()); // Stop microphone access
        };

    }
});

////////////////////////////////
/// END OF AUDIO INPUT CODE ////
////////////////////////////////


///////////////////////////////////////////
/// ADD NEW MESSAGES WITH DANCING DOTS ////
///////////////////////////////////////////
function appendChatbotMessage(message, chatArea, status) {      
    // New message from the chatbot
    var messageContent = document.createElement('div');
    messageContent.style.cssText = "word-wrap: break-word; width: 80%; border: 1px solid #F6F6F6; border-radius: 5px; padding: 15px; margin-bottom: 10px; background-color: #F6F6F6; display: block; margin-right: auto;  font-size: 18px; line-height: 1.5;";

    if (status === "waiting") {
        // Dancing dots animation
        messageContent.innerHTML = `
        <div word-wrap: break-word; width: 80%; border: 1px solid #F6F6F6; border-radius: 5px; padding: 5px; margin-bottom: 10px; background-color: #F6F6F6; display: block; margin-right: auto;>
        <div id="wave" style="position:relative; vertical-align: center text-align:left"; text-align:center;">
        <span class="dot" style="display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; background:#075E54; animation: wave 0.8s linear infinite;"></span>
        <span class="dot" style="display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; background:#075E54; animation: wave 0.8s linear infinite; animation-delay: -0.6s;"></span>
        <span class="dot" style="display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; background:#075E54; animation: wave 0.8s linear infinite; animation-delay: -0.5s;"></span>
        </div><style>@keyframes wave {0%, 60%, 100% {transform: initial;} 30% {transform: translateY(-7px);}}</style></div>`;
        messageContent.id = "dancingDots"; 
    } else if (status === "response") {
        var existingDots = document.getElementById("dancingDots");
        if (existingDots) {
            existingDots.innerText = message.trim();
            existingDots.removeAttribute('id');
            chatArea.scrollTop = chatArea.scrollHeight;
            return; // Since the message is replaced, we don't need to append anything new
        } else {
            messageContent.innerText = message.trim();
        }
    }
    chatArea.appendChild(messageContent);
    chatArea.scrollTop = chatArea.scrollHeight;
}

// Add the initial question to the chat area from Flask message
var firstQuestion = "{{ data['message'] }}"
if (firstQuestion == "interview_in_progress_error") {
    submitButton.disabled = true;
    submitButton.style.backgroundColor = '#ccc';
    firstQuestion = "This interview session is already in progress. Please exit."
}
appendChatbotMessage(firstQuestion, chatArea, "response");


////////////////////////////////////////////////////////////
// Prevent copy, cut, and paste in chatArea and userInput /
////////////////////////////////////////////////////////////
["copy", "cut", "paste"].forEach(eventType => {
    [chatArea, userInput].forEach(element => {
        element.addEventListener(eventType, event => {
            event.preventDefault();
        });
    });
});


////////////////////////////////////////////////////////////
// GENERATE THE NEXT QUESTION ON SUBMIT BUTTON CLICK ///////
////////////////////////////////////////////////////////////

// THIS IS THE SUBMIT FUNCTION
function submitUserMessage() {
    var userMessage = userInput.value.trim();
    if (userMessage) {
        userInput.value = "";
        submitButton.disabled = true;
        submitButton.style.backgroundColor = '#ccc';
        submitButton.innerText = "Waiting for reply...";
        recordButton.disabled = true;

        var messageContent = document.createElement('div');
        messageContent.style.cssText = "display: inline-block; max-width: 80%; border: 1px solid #ddd; border-radius: 5px; padding: 5px; margin-bottom: 10px; background-color: #dcf8c6; word-wrap: break-word; white-space: pre-wrap; box-sizing: border-box; font-size: 18px; text-align: left; line-height: 1.5;";
        messageContent.innerText = userMessage;
                    
        chatArea.appendChild(messageContent);
        chatArea.scrollTop = chatArea.scrollHeight;

        appendChatbotMessage("", chatArea, "waiting");

        jQuery.ajax({
            url: "{{ url_for('next') }}",
            timeout: 60000,
            type: "POST",
            data: JSON.stringify({
                user_message: userMessage,
                session_id: "{{ data['session_id'] }}",
                interview_id: "{{ data['interview_id'] }}"
            }),
            contentType: "application/json",
            dataType: "json",
            success: function (data) {
                var next_question = data.message ? data.message.trim() : "";
                var image_url = data.image_url;

                var endInterviewIndex = next_question.indexOf("---END---");
                if (endInterviewIndex !== -1) {
                    next_question = next_question.replace("---END---", "").trim();
                    submitButton.disabled = true;
                    submitButton.innerText = "End of interview";
                    recordButton.disabled = true;
                } else {
                    submitButton.disabled = false;
                    submitButton.innerText = "Submit response";
                    submitButton.style.backgroundColor = '#25d366';
                    recordButton.disabled = false;
                }

                // Append the message
                appendChatbotMessage(next_question, chatArea, "response");

                // Append image if one is provided
                if (image_url) {
                    var imageWrapper = document.createElement("div");
                    imageWrapper.style.cssText = "width: 90%; margin-bottom: 10px; display: block; margin-right: auto; text-align: center;";

                    var imageElement = document.createElement("img");
                    imageElement.src = image_url;
                    imageElement.alt = "Visual aid";
                    imageElement.style.cssText = "max-width: 100%; max-height: 400px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);";

                    imageWrapper.appendChild(imageElement);
                    chatArea.appendChild(imageWrapper);
                    chatArea.scrollTop = chatArea.scrollHeight;
                }
            },

            error: function () {
                appendChatbotMessage("There was a technical error. Please try again.", chatArea, "response");
                submitButton.disabled = false;
                submitButton.style.backgroundColor = '#25d366';
                submitButton.innerText = "Submit response";
                recordButton.disabled = false;
            }
        });
    }
}

submitButton.addEventListener("click", submitUserMessage);

// NEW: Allow "Enter" to trigger Submit
userInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault(); // prevent new line
        submitUserMessage();
    }
});

</script>
